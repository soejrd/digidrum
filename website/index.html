<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digidrum</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Temporary holding screen. The web player is removed for now; this
           only borrows the panel palette from style.css. */
        .screen {
            padding: 28px 26px 30px;
            border: 1px solid var(--line);
            border-radius: 3px;
            background:
                repeating-linear-gradient(to bottom, #ffffff06 0 1px, transparent 1px 3px),
                var(--screen);
            box-shadow: inset 0 0 44px #000a, 0 0 26px #f0b65d10;
            color: var(--amber);
            text-shadow: 0 0 8px #f0b65d5c;
        }

        .screen-line {
            margin: 0 0 10px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .28em;
            text-transform: uppercase;
        }

        .screen-line.dim {
            color: var(--muted);
            font-weight: 400;
            letter-spacing: .18em;
            text-shadow: none;
        }

        .screen-line.big {
            margin: 20px 0 22px;
            font-size: 24px;
            letter-spacing: .16em;
            color: #ffd489;
        }

        .cursor { animation: blink 1s steps(1) infinite; }

        .meter {
            height: 10px;
            border: 1px solid var(--line);
            background: #0a0d0a;
            overflow: hidden;
        }

        .meter span {
            display: block;
            height: 100%;
            width: 40%;
            background: var(--amber);
            box-shadow: 0 0 12px #f0b65d99;
            animation: load 3.2s ease-in-out infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }
        @keyframes load {
            0%   { width: 8%; }
            50%  { width: 92%; }
            100% { width: 8%; }
        }

        @media (prefers-reduced-motion: reduce) {
            .cursor, .meter span { animation: none; }
            .meter span { width: 60%; }
        }

        #audio-status { margin-top: 18px; margin-bottom: 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Digidrum</h1>
        <div class="screen" role="status">
            <p class="screen-line">Machine data offline</p>
            <p class="screen-line dim">Web player removed for upgrade</p>
            <p class="screen-line big">Coming next week<span class="cursor">_</span></p>
            <div class="meter"><span></span></div>
        </div>
        <p id="audio-status">New sound machines are being installed. Check back soon.</p>
    </div>
</body>
</html>
